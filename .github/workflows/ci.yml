name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
        os: [ubuntu-latest]
        include:
          # The build touches the file system, so prove it works off Linux.
          - node: "22"
            os: windows-latest
          - node: "22"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
